version: '3.8'

services:
  # Prometheus - Time series database for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: chemstools_prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    networks:
      - chemstools_network
    restart: unless-stopped

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: chemstools_grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=chemstools_admin
      - GF_INSTALL_PLUGINS=redis-datasource,redis-app
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_ANALYTICS_REPORTING_ENABLED=false
    ports:
      - "3001:3000"
    networks:
      - chemstools_network
    restart: unless-stopped
    depends_on:
      - prometheus

  # Redis Exporter - Exports Redis metrics
  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: chemstools_redis_exporter
    environment:
      - REDIS_ADDR=redis://chemstools_project-redis-1:6379
      - REDIS_PASSWORD=
    ports:
      - "9121:9121"
    networks:
      - chemstools_network
    restart: unless-stopped

  # Node Exporter - System metrics
  node_exporter:
    image: prom/node-exporter:latest
    container_name: chemstools_node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - chemstools_network
    restart: unless-stopped

  # Postgres Exporter - Database metrics
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: chemstools_postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://chemstools_user:chemstools_password@chemstools_project-db-1:5432/chemstools_db?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - chemstools_network
    restart: unless-stopped

  # AlertManager - Handle alerts from Prometheus
  alertmanager:
    image: prom/alertmanager:latest
    container_name: chemstools_alertmanager
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
    ports:
      - "9093:9093"
    networks:
      - chemstools_network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  chemstools_network:
    external: true
    name: chemstools_project_default
