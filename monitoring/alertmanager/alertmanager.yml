global:
  resolve_timeout: 5m
  smtp_from: 'alerts@chemstools.local'
  smtp_smarthost: 'localhost:25'
  smtp_require_tls: false

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alerts
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  
  routes:
    # Critical alerts
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
      
    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 30s
      
    # Database alerts
    - match:
        service: postgresql
      receiver: 'database-team'
      
    # API alerts
    - match:
        service: api
      receiver: 'backend-team'

# Notification receivers
receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://backend:8000/api/monitoring/webhook/alerts'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://backend:8000/api/monitoring/webhook/critical'
        send_resolved: true
    # Email config (if SMTP is configured)
    # email_configs:
    #   - to: 'admin@chemstools.com'
    #     headers:
    #       Subject: 'CRITICAL: {{ .GroupLabels.alertname }}'

  - name: 'warning'
    webhook_configs:
      - url: 'http://backend:8000/api/monitoring/webhook/warnings'
        send_resolved: true

  - name: 'database-team'
    webhook_configs:
      - url: 'http://backend:8000/api/monitoring/webhook/database'
        send_resolved: true

  - name: 'backend-team'
    webhook_configs:
      - url: 'http://backend:8000/api/monitoring/webhook/backend'
        send_resolved: true

# Inhibition rules to suppress certain alerts
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
